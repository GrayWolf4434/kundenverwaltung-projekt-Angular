<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Name:</label>
    <input formControlName="name" />
  </div>
  <div class="form-group">
    <label>E-Mail:</label>
    <input formControlName="email" />
  </div>
  <button type="submit">{{ id ? 'Aktualisieren' : 'Speichern' }}</button>
  <button type="button" routerLink="/customers">Abbrechen</button>
</form>
