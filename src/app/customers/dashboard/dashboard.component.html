<mat-card class="sub-toolbar">
  <div class="actions">
    <button
      mat-icon-button
      *ngFor="let a of actions"
      [routerLink]="a.route"
      matTooltip="{{ a.label }}">
      <mat-icon>{{ a.icon }}</mat-icon>
    </button>
  </div>
</mat-card>

<mat-card class="search-panel">
  <form [formGroup]="form" (ngSubmit)="onSearch()" class="search-fields">
    <mat-form-field>
      <mat-label>Suchkriterien</mat-label>
      <mat-select formControlName="criteria">
        <mat-option value="vertragsende">Vertragsende</mat-option>
        <mat-option value="name">Name</mat-option>
        <mat-option value="kundennummer">Kundennummer</mat-option>
      </mat-select>
    </mat-form-field>

    <ng-container *ngIf="form.get('criteria')?.value === 'vertragsende'">
      <mat-form-field>
        <mat-label>Datum</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </ng-container>

    <ng-container *ngIf="form.get('criteria')?.value !== 'vertragsende'">
      <mat-form-field>
        <mat-label>Suchbegriff</mat-label>
        <input matInput formControlName="term" />
      </mat-form-field>
    </ng-container>

    <button mat-icon-button color="primary" type="submit" matTooltip="Suche">
      <mat-icon>search</mat-icon>
    </button>
    <button mat-icon-button color="warn" type="button"
            (click)="onClear()" matTooltip="Suchliste löschen">
      <mat-icon>clear</mat-icon>
    </button>
  </form>
</mat-card>

<mat-card class="table-card">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <!-- Spaltendefinitionen … (wie vorher) -->
    <ng-container matColumnDef="listNo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>List No</th>
      <td mat-cell *matCellDef="let e">{{ e.listNo }}</td>
    </ng-container>
    <!-- weitere Spalten analog … -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSize]="10"></mat-paginator>
</mat-card>

<mat-card class="status-bar">
  <span>Kundenanzahl auf Liste: {{ dataSource.data.length }}</span>
</mat-card>
