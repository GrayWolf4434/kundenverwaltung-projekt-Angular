<div class="login-card">
  <h2>Registrieren</h2>
  <form [formGroup]="regForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Benutzername</label>
      <input id="username" formControlName="username" />
    </div>
    <div class="form-group">
      <label for="password">Passwort</label>
      <input id="password" type="password" formControlName="password" />
    </div>
    <div class="form-group">
      <label for="confirm">Passwort bestätigen</label>
      <input id="confirm" type="password" formControlName="confirm" />
    </div>
    <button type="submit" [disabled]="regForm.invalid">Anlegen</button>
  </form>
  <a class="forgot" routerLink="/login">Zurück zum Login</a>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
